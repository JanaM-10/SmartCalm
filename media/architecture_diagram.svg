<svg viewBox="0 0 1300 400" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#01122B"/>
      <stop offset="100%" stop-color="#062040"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0B2340"/>
      <stop offset="100%" stop-color="#081A30"/>
    </linearGradient>
    <linearGradient id="arrowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4FC3E0"/>
      <stop offset="100%" stop-color="#C2E7F0"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#C2E7F0"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1300" height="400" fill="url(#bg)"/>
  <circle cx="1180" cy="60" r="150" fill="#C2E7F0" opacity="0.04"/>
  <circle cx="80" cy="340" r="130" fill="#4FC3E0" opacity="0.05"/>

  <!-- Connecting line -->
  <line x1="150" y1="200" x2="1150" y2="200" stroke="url(#arrowGrad)" stroke-width="2" stroke-dasharray="1,7" stroke-linecap="round" opacity="0.6"/>

  <!-- ===== Stage 1: Wristband ===== -->
  <g filter="url(#glow)">
    <rect x="50" y="120" width="200" height="160" rx="18" fill="url(#cardGrad)" stroke="#4FC3E0" stroke-width="1.5"/>
  </g>
  <circle cx="150" cy="155" r="20" fill="none" stroke="#C2E7F0" stroke-width="2"/>
  <rect x="140" y="145" width="20" height="20" rx="4" fill="#C2E7F0"/>
  <text x="150" y="192" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">ESP32-S3</text>
  <text x="150" y="208" text-anchor="middle" font-size="12" fill="#8FB8CC">Wristband</text>
  <line x1="80" y1="220" x2="220" y2="220" stroke="#1B3A5C" stroke-width="1"/>
  <text x="150" y="238" text-anchor="middle" font-size="11" fill="#C2E7F0">EDA · BVP · TEMP</text>
  <text x="150" y="256" text-anchor="middle" font-size="11" fill="#C2E7F0">3-axis Accelerometer</text>
  <text x="150" y="274" text-anchor="middle" font-size="10" fill="#5C7A94">sampled every 250ms</text>

  <!-- ===== Stage 2: Feature Extraction ===== -->
  <g filter="url(#glow)">
    <rect x="290" y="120" width="200" height="160" rx="18" fill="url(#cardGrad)" stroke="#4FC3E0" stroke-width="1.5"/>
  </g>
  <path d="M370 148 L390 148 L390 138 L410 158 L390 178 L390 168 L370 168 Z" fill="#C2E7F0" opacity="0.9" transform="translate(0,0)"/>
  <text x="390" y="192" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">Feature Extraction</text>
  <line x1="320" y1="220" x2="460" y2="220" stroke="#1B3A5C" stroke-width="1"/>
  <text x="390" y="238" text-anchor="middle" font-size="11" fill="#C2E7F0">60-reading buffer</text>
  <text x="390" y="256" text-anchor="middle" font-size="11" fill="#C2E7F0">~81 statistical features</text>
  <text x="390" y="274" text-anchor="middle" font-size="10" fill="#5C7A94">RobustScaler normalized</text>

  <!-- ===== Stage 3: ML Model ===== -->
  <g filter="url(#glow)">
    <rect x="530" y="105" width="230" height="190" rx="18" fill="url(#cardGrad)" stroke="#7FE0C4" stroke-width="1.5"/>
  </g>
  <circle cx="645" cy="145" r="8" fill="#7FE0C4"/>
  <circle cx="625" cy="165" r="6" fill="#7FE0C4" opacity="0.7"/>
  <circle cx="665" cy="165" r="6" fill="#7FE0C4" opacity="0.7"/>
  <line x1="645" y1="145" x2="625" y2="165" stroke="#7FE0C4" stroke-width="1.5"/>
  <line x1="645" y1="145" x2="665" y2="165" stroke="#7FE0C4" stroke-width="1.5"/>
  <text x="645" y="192" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">Deep Residual MLP</text>
  <line x1="560" y1="212" x2="730" y2="212" stroke="#1B3A5C" stroke-width="1"/>
  <text x="645" y="232" text-anchor="middle" font-size="11" fill="#7FE0C4">GAN-augmented · WESAD</text>
  <text x="645" y="250" text-anchor="middle" font-size="11" fill="#7FE0C4">ONNX Runtime inference</text>
  <text x="645" y="268" text-anchor="middle" font-size="18" font-weight="bold" fill="#ffffff">94.5% Acc</text>
  <text x="645" y="284" text-anchor="middle" font-size="10" fill="#5C7A94">Calm · Mild · High</text>

  <!-- ===== Stage 4: Supabase ===== -->
  <g filter="url(#glow)">
    <rect x="800" y="120" width="200" height="160" rx="18" fill="url(#cardGrad)" stroke="#3ECF8E" stroke-width="1.5"/>
  </g>
  <ellipse cx="900" cy="148" rx="16" ry="7" fill="none" stroke="#3ECF8E" stroke-width="2"/>
  <path d="M884 148 L884 165 A16 7 0 0 0 916 165 L916 148" fill="none" stroke="#3ECF8E" stroke-width="2"/>
  <text x="900" y="192" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">Supabase</text>
  <line x1="830" y1="212" x2="970" y2="212" stroke="#1B3A5C" stroke-width="1"/>
  <text x="900" y="232" text-anchor="middle" font-size="11" fill="#3ECF8E">Auth · Postgres</text>
  <text x="900" y="250" text-anchor="middle" font-size="11" fill="#3ECF8E">Readings · Sessions · Journal</text>
  <text x="900" y="268" text-anchor="middle" font-size="10" fill="#5C7A94">Row Level Security</text>

  <!-- ===== Stage 5: Mobile App ===== -->
  <g filter="url(#glow)">
    <rect x="1050" y="105" width="200" height="190" rx="18" fill="url(#cardGrad)" stroke="#6FB3E0" stroke-width="1.5"/>
  </g>
  <rect x="1132" y="130" width="36" height="60" rx="6" fill="none" stroke="#6FB3E0" stroke-width="2"/>
  <line x1="1140" y1="180" x2="1160" y2="180" stroke="#6FB3E0" stroke-width="2"/>
  <text x="1150" y="212" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">Flutter App</text>
  <line x1="1080" y1="232" x2="1220" y2="232" stroke="#1B3A5C" stroke-width="1"/>
  <text x="1150" y="252" text-anchor="middle" font-size="11" fill="#6FB3E0">Live stress display</text>
  <text x="1150" y="270" text-anchor="middle" font-size="11" fill="#6FB3E0">Trends · Journal</text>
  <text x="1150" y="286" text-anchor="middle" font-size="10" fill="#5C7A94">Calming activities</text>

  <!-- Arrows between cards -->
  <path d="M255 200 Q270 200 285 200" stroke="#C2E7F0" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M495 200 Q510 200 525 200" stroke="#C2E7F0" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M765 200 Q782 200 795 200" stroke="#C2E7F0" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M1005 200 Q1027 200 1045 200" stroke="#C2E7F0" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
</svg>
